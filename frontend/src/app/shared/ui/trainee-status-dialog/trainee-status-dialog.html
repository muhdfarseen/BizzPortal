<div class="modal-backdrop" (click)="onCancel()">
  <div
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="trainee-status-title"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-header">
      <div class="modal-title-area">
        <span class="modal-icon-badge" aria-hidden="true">
          <ng-icon name="reiconArrowSwapHorizontal" size="20" />
        </span>
        <div>
          <h2 id="trainee-status-title" class="modal-title">Change status</h2>
          <p class="modal-subtitle">
            {{ request().trainee.name }} &bull; {{ request().trainee.employeeId }}
          </p>
        </div>
      </div>

      <button type="button" class="modal-close-btn" aria-label="Close dialog" (click)="onCancel()">
        <ng-icon name="reiconCloseCircle" size="20" />
      </button>
    </header>

    <div class="modal-body">
      <p class="current-status">
        Currently <strong>{{ statusLabel(currentStatus()) }}</strong>
      </p>

      <label class="field">
        <span class="field-label">New status</span>
        <app-select
          [options]="statusOptions()"
          [value]="chosen()"
          placeholder="Select status"
          ariaLabel="New status"
          (valueChange)="onStatusChange($event)"
        />
      </label>

      <label class="field">
        <span class="field-label">Effective date</span>
        <input
          type="date"
          class="date-input"
          [value]="effectiveDate()"
          [attr.max]="latestEffectiveDate"
          aria-label="Effective date"
          (input)="onDateInput($event)"
        />
        <span class="field-hint">The day this trainee takes up the new status.</span>
      </label>

      <label class="field">
        <span class="field-label">Remark</span>
        <textarea
          class="remark-input"
          rows="3"
          placeholder="Record why the status is changing"
          aria-label="Remark"
          [value]="remark()"
          (input)="onRemarkInput($event)"
        ></textarea>
        <span class="field-hint">Recorded with the change, and shown in the table.</span>
      </label>

      <p class="confirm-text">{{ confirmText() }}</p>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-primary" [disabled]="!canConfirm()" (click)="onConfirm()">
        Change status
      </button>
    </footer>
  </div>
</div>
