# Test profile.
#
# Points at a dedicated database so running the suite never touches the
# development data, and so a test run cannot be confused by whatever is in it.
# Flyway builds the schema from the same migrations production uses, which means
# the tests fail if a migration and its entities disagree — the check that
# `ddl-auto: validate` performs at startup.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/bizzskill_portal_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

portal:
  security:
    password-encoding: plain
    jwt:
      secret: test-only-secret-0123456789abcdefghijklmnop
      issuer: bizzskill-portal-test
      ttl: 1h
